
# More option see https://github.com/DreamMaoMao/mango/wiki/

# Qt/KDE apps (Dolphin) read the GitHub Dark colors/fonts from kdeglobals
env=QT_QPA_PLATFORMTHEME,kde

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=1
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
xwayland_persistence=1
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
cursor_theme=Bibata-Modern-Ice
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
# GitHub Dark (Primer)
root_color=0x0d1117ff
border_color=0x30363dff
drop_color=0x58a6ff55
split_color=0xd29922ff
#focus_color=0x388bfdff
focus_color=0x37424Fff
maximized_screen_color=0x3fb950ff
urgent_color=0xf85149ff
scratchpad_color=0xbc8cffff
global_color=0xdb61a2ff
overlay_color=0x39c5cfff

# layout support:
# tile,dwindle,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# layouts included in SUPER+n (switch_layout) cycles
circle_layout=dwindle,scroller,tile

# Monitors
# 2k external (DP-1, 2560x1440) on the left, laptop panel (eDP-1) to its right.
monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:165,x:0,y:0,scale:1
monitor_rule=name:^eDP-1$,x:2560,y:0,scale:1

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal

# app launcher
bind=SUPER,space,spawn,fuzzel
# terminal
bind=SUPER,Return,spawn,kitty
# file manager
bind=SUPER+SHIFT,e,spawn,dolphin
# browser
bind=SUPER,b,spawn,helium-browser
# opencode (terminal UI)
bind=SUPER,o,spawn,kitty -e opencode
# this keybind list
bind=SUPER,slash,spawn,/home/ncpt/.config/mango/keybinds.sh
# power profile: quiet -> balanced -> performance (swayosd OSD)
bind=SUPER,p,spawn,/home/ncpt/.config/mango/scripts/powerprofile.sh next
# clipboard history picker
bind=SUPER,v,spawn,/home/ncpt/.config/mango/scripts/clipboard.sh
# screenshot region (click notification to annotate)
bind=SUPER+SHIFT,s,spawn,/home/ncpt/.config/mango/scripts/screenshot.sh
# screenshot the current screen (no annotation)
bind=SUPER,s,spawn,/home/ncpt/.config/mango/scripts/screenshot-full.sh
# screenshot the current screen, annotate in satty
bind=SUPER+CTRL,s,spawn,/home/ncpt/.config/mango/scripts/screenshot-full.sh satty
# Print: full screen (no annotation)
bind=none,Print,spawn,/home/ncpt/.config/mango/scripts/screenshot-full.sh
# Ctrl+Print: region (click notification to annotate)
bind=CTRL,Print,spawn,/home/ncpt/.config/mango/scripts/screenshot.sh
# Shift+Print: start/stop screen recording
bind=SHIFT,Print,spawn,/home/ncpt/.config/mango/scripts/record.sh toggle
# start/stop screen recording
bind=SUPER,j,spawn,/home/ncpt/.config/mango/scripts/record.sh toggle
# hide/show the bar
bind=SUPER,h,spawn,/home/ncpt/.config/mango/scripts/bar.sh
# toggle night light
bind=SUPER+ALT,n,spawn,/home/ncpt/.config/mango/scripts/nightlight.sh
# turn the laptop panel off/on
bind=SUPER+ALT,p,spawn,/home/ncpt/.config/mango/scripts/panel.sh

# media keys (keyboard volume knob)

# volume up
bind=none,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume +2
# volume down
bind=none,XF86AudioLowerVolume,spawn,swayosd-client --output-volume -2
# mute
bind=none,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
# brightness up (Ctrl+knob)
bind=CTRL,XF86AudioRaiseVolume,spawn,/home/ncpt/.config/mango/scripts/knob.sh up
# brightness down (Ctrl+knob)
bind=CTRL,XF86AudioLowerVolume,spawn,/home/ncpt/.config/mango/scripts/knob.sh down
# pick brightness screen
bind=CTRL,XF86AudioMute,spawn,/home/ncpt/.config/mango/scripts/knob.sh screen
# next audio output (Alt+knob press)
bind=ALT,XF86AudioMute,spawn,/home/ncpt/.config/mango/scripts/knob.sh sink

# exit
# quit mango
bind=SUPER,m,quit
# close window
bind=SUPER,q,killclient,

# lock screen
bind=SUPER,l,spawn,swaylock -f -c 000000

# power menu
bind=SUPER,Escape,spawn_shell,GDK_BACKEND=wayland wlogout -C /home/ncpt/.config/mango/wlogout/style.css -l /home/ncpt/.config/mango/wlogout/layout -b 6 --protocol layer-shell

# switch window focus
# next window
bind=SUPER,Tab,focusstack,next
# focus left
bind=SUPER,Left,focusdir,left
# focus right
bind=SUPER,Right,focusdir,right
# focus up
bind=SUPER,Up,focusdir,up
# focus down
bind=SUPER,Down,focusdir,down

# move window
# move up
bind=SUPER+SHIFT,Up,move_client,up
# move down
bind=SUPER+SHIFT,Down,move_client,down
# move left
bind=SUPER+SHIFT,Left,move_client,left
# move right
bind=SUPER+SHIFT,Right,move_client,right

# switch window status
# show on every tag
bind=SUPER,g,toggleglobal,
# swap to last window
bind=ALT,Tab,togglejump,
# float / tile
bind=SUPER,backslash,togglefloating,
# float / tile (legacy)
bind=ALT,backslash,togglefloating,
# maximize
bind=SUPER,a,togglemaximizescreen,
# fullscreen
bind=SUPER,f,togglefullscreen,
# fake fullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen,
# minimize
bind=SUPER,i,minimized,
# overlay layer
bind=SUPER+SHIFT,o,toggleoverlay,
# restore minimized
bind=SUPER+SHIFT,I,restore_minimized
# scratchpad
bind=SUPER,z,toggle_scratchpad

# scroller layout

# window width 100%
bind=SUPER,e,set_proportion,1.0
# cycle width presets
bind=SUPER,x,switch_proportion_preset,
# stack left
bind=alt+super+ctrl,Left,scroller_stack,left
# stack right
bind=alt+super+ctrl,Right,scroller_stack,right
# stack up
bind=alt+super+ctrl,Up,scroller_stack,up
# stack down
bind=alt+super+ctrl,Down,scroller_stack,down

# dwindle layout (manual split mode)
# flip split direction
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
# previous tag
bind=SUPER+CTRL,Left,viewtoleft,0
# next tag
bind=SUPER+CTRL,Right,viewtoright,0
# move window to previous tag
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
# move window to next tag
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0

# go to tag 1
bind=SUPER,1,view,1,0
# go to tag 2
bind=SUPER,2,view,2,0
# go to tag 3
bind=SUPER,3,view,3,0
# go to tag 4
bind=SUPER,4,view,4,0
# go to tag 5
bind=SUPER,5,view,5,0
# go to tag 6
bind=SUPER,6,view,6,0
# go to tag 7
bind=SUPER,7,view,7,0
# go to tag 8
bind=SUPER,8,view,8,0
# go to tag 9
bind=SUPER,9,view,9,0

# tag: move the client there (tagsilent would not follow it)
# move window to tag 1
bind=SUPER+SHIFT,1,tag,1,0
# move window to tag 2
bind=SUPER+SHIFT,2,tag,2,0
# move window to tag 3
bind=SUPER+SHIFT,3,tag,3,0
# move window to tag 4
bind=SUPER+SHIFT,4,tag,4,0
# move window to tag 5
bind=SUPER+SHIFT,5,tag,5,0
# move window to tag 6
bind=SUPER+SHIFT,6,tag,6,0
# move window to tag 7
bind=SUPER+SHIFT,7,tag,7,0
# move window to tag 8
bind=SUPER+SHIFT,8,tag,8,0
# move window to tag 9
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
# focus monitor left
bind=alt+shift,Left,focusmon,left
# focus monitor right
bind=alt+shift,Right,focusmon,right
# send window to monitor left
bind=SUPER+Alt,Left,tagmon,left
# send window to monitor right
bind=SUPER+Alt,Right,tagmon,right

# gaps
# more gaps
bind=SUPER+SHIFT,X,incgaps,1
# fewer gaps
bind=SUPER+SHIFT,Z,incgaps,-1
# toggle gaps
bind=SUPER+SHIFT,R,togglegaps

# movewin (floating window position)
# float up
bind=CTRL+SHIFT,Up,movewin,+0,-50
# float down
bind=CTRL+SHIFT,Down,movewin,+0,+50
# float left
bind=CTRL+SHIFT,Left,movewin,-50,+0
# float right
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin (floating window size)
# shorter
bind=CTRL+ALT,Up,resizewin,+0,-50
# taller
bind=CTRL+ALT,Down,resizewin,+0,+50
# narrower
bind=CTRL+ALT,Left,resizewin,-50,+0
# wider
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
# drag window
mousebind=SUPER,btn_left,moveresize,curmove
# Super + middle click: toggle maximize (plain middle stays free for paste-ish apps)
mousebind=SUPER,btn_middle,togglemaximizescreen,0
# drag window edge to resize
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
# wheel up: previous tag
axisbind=SUPER,UP,viewtoleft_have_client
# wheel down: next tag
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
# 3-finger swipe left
gesturebind=none,left,3,focusdir,left
# 3-finger swipe right
gesturebind=none,right,3,focusdir,right
# 3-finger swipe up
gesturebind=none,up,3,focusdir,up
# 3-finger swipe down
gesturebind=none,down,3,focusdir,down
# 4-finger swipe right: previous tag
gesturebind=none,right,4,viewprev_have_client
# 4-finger swipe left: next tag
gesturebind=none,left,4,viewnext_have_client
# 4-finger swipe up: overview
gesturebind=none,up,4,enteroverview
# 4-finger swipe down: leave overview
gesturebind=none,down,4,leaveoverview


# window rules: dialogs float instead of tiling
# app -> tag: 1 terminal, 2 browser, 3 social
#window_rule=tags:1,app_id:^kitty$
window_rule=tags:2,app_id:^helium$
window_rule=tags:3,app_id:^(vesktop|com\.ayugram\.desktop)$
# AyuGram: honour its minimize request, so "-startintray" really hides it in the tray at login.
# (ignore_minimize defaults to 1, which kept the window open on the laptop screen.)
window_rule=ignore_minimize:0,app_id:^com\.ayugram\.desktop$
# AyuGram media viewer (photos/videos): float and fullscreen
window_rule=is_floating:1,is_fullscreen:1,app_id:^com\.ayugram\.desktop$,title:^Media viewer$
# LocalSend: tray-only, no focus steal, honour its own minimize so --hidden works
window_rule=is_floating:1,is_open_silent:1,ignore_minimize:0,app_id:^org\.localsend\.localsend_app$
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk
window_rule=is_floating:1,app_id:polkit-gnome-authentication-agent-1
window_rule=is_floating:1,app_id:^imv$
window_rule=is_floating:1,app_id:^com\.saivert\.pwvucontrol$
# Bitwarden extension popup (Helium): float instead of tiling
window_rule=is_floating:1,app_id:^chrome-nngceckbapebfimnlniiiahkandclblb-Default$
# Helium OAuth popup (Google sign-in): float instead of tiling
window_rule=is_floating:1,app_id:^helium$,title:^Sign in - Google Accounts( - Helium)?$
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,title:^(Progress Dialog — Dolphin|Copying — Dolphin)$
window_rule=is_floating:1,title:^(Open|Save)( File| As)?$
window_rule=is_floating:1,width:480,height:270,offset_x:100,offset_y:100,title:^Picture in picture$
window_rule=is_floating:1,title:^(Choose Files|Select Folder|Authentication Required|Confirm to replace files|File Operation Progress)$

# layer rule
# fuzzel: zoom in / out
layer_rule=animation_type_open:zoom,layer_name:fuzzel
layer_rule=animation_type_close:zoom,layer_name:fuzzel
# mako notifications: fade
layer_rule=animation_type_open:fade,layer_name:notifications
layer_rule=animation_type_close:fade,layer_name:notifications
# wlogout: zoom
layer_rule=animation_type_open:zoom,layer_name:logout_dialog
layer_rule=animation_type_close:zoom,layer_name:logout_dialog

# >>> post-install autostart >>>
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE QT_QPA_PLATFORMTHEME
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=mako
exec_once=swaybg -i ~/.config/mango/wallpaper/miku-light.jpg -m fill
#exec_once=swaybg -c 000000
exec_once=mangobar
# volume/brightness OSD
exec_once=swayosd-server
# keep the clipboard after the owning app exits + history for SUPER+v
exec_once=wl-clip-persist --clipboard regular
exec_once=wl-paste --type text --watch cliphist store
# tray applets
exec_once=nm-applet
exec_once=blueman-applet
# login apps (tag rules above keep them on 1/2/3)
exec_once=localsend --hidden
exec_once=vesktop --start-minimized
exec_once=AyuGram -startintray
#exec_once=helium-browser
# Power-aware idle (see scripts/idle.sh): AC = screen off only; battery = screen off, lock, suspend
exec_once=/home/ncpt/.config/mango/scripts/idle.sh

# Hybrid NVIDIA laptops: if the compositor picks the wrong GPU, pin the iGPU
# (find the right card with: ls -l /dev/dri/by-path)
# env=WLR_DRM_DEVICES,/dev/dri/card0
# NVIDIA video decode in browsers (dGPU-only setups):
# env=LIBVA_DRIVER_NAME,nvidia
# <<< post-install autostart <<<
