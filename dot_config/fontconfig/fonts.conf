<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/75-apple-color-emoji.conf</include>
  <!-- Make every monospace request resolve to JetBrains Mono (Nerd Font) -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Sans-serif UI text (GTK, KDE, browsers) -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Flex</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Flex</string>
    </edit>
  </match>
</fontconfig>
