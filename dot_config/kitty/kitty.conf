# kitty.conf — see kitty.conf(5)

# Font: default is 11.0; 13.0 is more comfortable on these panels.
font_size 13.0

# Slightly transparent so mango's blur shows through the terminal background.
background_opacity 0.8

# Blank space between the text and the window edge.
window_padding_width 5

# No scrollbar.
scrollbar never

# Right-click copies the current selection to the clipboard.
# Auto-copy-on-select is intentionally off.
# Paste with ctrl+shift+v. Ctrl+scroll zoom is not supported by kitty — use the
# built-in ctrl+shift+equal / ctrl+shift+minus / ctrl+shift+backspace.
mouse_map right press ungrabbed copy_to_clipboard

# Don't ask "are you sure?" when closing a window/tab with a running command.
confirm_os_window_close 0

# Colors: GitHub Dark (Primer)
foreground              #C9D1D9
background              #0D1117
